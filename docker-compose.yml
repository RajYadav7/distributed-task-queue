version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tqe-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: taskqueue
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - tqe-net

  redis:
    image: redis:7.0
    container_name: tqe-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tqe-net

  backend:
    build: ./backend
    container_name: tqe-backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root1234
      DB_NAME: taskqueue
      REDIS_URL: redis://redis:6379
      PORT: 8080
    networks:
      - tqe-net
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: tqe-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - tqe-net

volumes:
  mysql_data:

networks:
  tqe-net:
    driver: bridge
